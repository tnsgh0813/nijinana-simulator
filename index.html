<style>
/* Layout: one 1600×900 board scaled to fit the window (no scrolling). The official playmat in a soft prism-pastel room:
   my half below the centre bar, the AI's half rotated 180° above it, hands fanned at the top and bottom edges,
   floating tools top-left, card details pop up over the board. Deliberately single-theme (light pastel). */
:root{
  --ink:#1f2442; --ink-2:#4b5175; --ink-3:#8a87a8;
  --paper:#fffafd; --navy:#1c2440; --navy-2:#2a3558; --glass:rgba(30,32,70,.82);
  --zone:rgba(255,255,255,.34); --zline:rgba(205,92,150,.42);
  --accent:#d6337a; --ai:#4458c9; --focus:#3b6cf0; --gold:#ffcf5a;
  --sun:#d72e68; --moon:#2160c2; --comet:#17955a; --star:#d49a00;
  --R:#e1344e; --O:#ef7829; --Y:#eebd23; --G:#19a065; --B:#26a0dc; --I:#2e45a4; --V:#8a44b5;
  --up:#13895a; --down:#cc3434;
  --f-body:'IBM Plex Sans KR','Noto Sans JP',system-ui,sans-serif;
  --f-jp:'Noto Sans JP','IBM Plex Sans KR',sans-serif;
  --f-num:'Chakra Petch','IBM Plex Sans KR',ui-monospace,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:#f1e6f6}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;
  background-color:#f3e6f5;
  background-image:
    linear-gradient(rgba(150,95,160,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(150,95,160,.07) 1px,transparent 1px),
    radial-gradient(circle at 18% 12%,#fde0ee 0,transparent 50%),radial-gradient(circle at 85% 88%,#d9ecfd 0,transparent 52%),
    linear-gradient(135deg,#f8e3f1,#ece5fb 50%,#e1effb);
  background-size:22px 22px,22px 22px,auto,auto,auto}
button{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden;overflow:clip}
#stage{user-select:none;-webkit-user-select:none}
#stage input{user-select:text;-webkit-user-select:text}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.arc{position:absolute;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 270deg,var(--R),var(--O),var(--Y),var(--G),var(--B),var(--I),var(--V),transparent 50%,transparent);opacity:.16}
.arc.a1{left:250px;top:-100px;width:1100px;height:1100px;-webkit-mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 68.6%,transparent 69%);mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 68.6%,transparent 69%)}
.arc.a2{left:250px;top:-100px;width:1100px;height:1100px;transform:rotate(180deg);-webkit-mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 68.6%,transparent 69%);mask:radial-gradient(circle,transparent 66%,#000 66.4%,#000 68.6%,transparent 69%)}

/* ---------- cards (sized by --s, everything inside in em) ---------- */
.card{--s:1;font-size:calc(10px*var(--s));width:6.2em;height:8.8em;border-radius:.26em;background:var(--navy);color:#fff;position:relative;
  display:flex;flex-direction:column;overflow:hidden;cursor:pointer;flex:none;user-select:none;
  box-shadow:0 .15em .4em rgba(25,20,60,.35);transition:transform .18s ease,box-shadow .18s ease}
.card .c-head{background:var(--cls);display:flex;align-items:center;gap:.3em;min-height:1.8em;padding-right:.3em}
.card .c-lv{background:#0e1828;font-family:var(--f-num);font-weight:700;font-size:1.25em;line-height:1.3em;min-width:1.3em;text-align:center;border-radius:0 0 .2em 0;align-self:flex-start}
.card .c-name{font-family:var(--f-jp);font-weight:700;font-size:.95em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.card .c-type{font-family:var(--f-num);font-size:.68em;letter-spacing:.14em;color:#9fb0c8;padding:.25em .45em 0}
.card .c-art{flex:1;margin:.2em .3em;border-radius:.15em;position:relative;overflow:hidden;min-height:0;padding:.3em;display:flex;flex-direction:column;justify-content:flex-end;gap:.2em;
  background:radial-gradient(circle at 70% 25%,color-mix(in srgb,var(--cls) 50%,transparent),transparent 62%),linear-gradient(160deg,color-mix(in srgb,var(--cls) 24%,#1d2c44),#121d2e)}
.card .glyph{position:absolute;right:.05em;top:-.1em;font-family:var(--f-jp);font-weight:900;font-size:3.4em;line-height:1;color:rgba(255,255,255,.16);pointer-events:none}
.card .badge{position:relative;align-self:flex-start;font-size:.72em;font-weight:700;letter-spacing:.04em;padding:.1em .35em;border-radius:.25em;background:rgba(255,255,255,.92);color:var(--navy)}
.card .badge.blk{background:#e0303f;color:#fff}
.card .badge.lim{background:#0e1828;color:#fff;border-radius:.6em;box-shadow:0 0 0 .08em rgba(255,255,255,.35)}
.card .badge.sp{background:#f2c230;color:#1b2534}
.card .c-txt{position:relative;font-size:.74em;line-height:1.18;color:#dbe3ee;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .c-pow{font-family:var(--f-num);font-weight:700;font-size:1.2em;padding:0 .35em;line-height:1.25em}
.card .c-pow.up{color:#7ef0b4}.card .c-pow.down{color:#ff9a9a}
.card .c-bar{display:grid;grid-template-columns:repeat(7,1fr);gap:.1em;height:.7em;margin:0 .3em .3em}
.card .c-bar i{background:#2a3b55;border-radius:.1em}
.card .c-bar i.on{background:var(--cc)}
.card.sun{--cls:var(--sun)} .card.moon{--cls:var(--moon)} .card.comet{--cls:var(--comet)} .card.star{--cls:var(--star)}
.card.event .c-art,.card.stage .c-art{background:linear-gradient(160deg,color-mix(in srgb,var(--cls) 30%,#f6f3f9),#ebe8f3)}
.card.event .c-txt,.card.stage .c-txt{color:#26344a}
.card.event .glyph,.card.stage .glyph{color:color-mix(in srgb,var(--cls) 22%,transparent)}
.card.tapped{transform:rotate(90deg)}
.card.picked{box-shadow:0 0 0 .2em #fff,0 0 0 .42em var(--focus)}
.card.playable{box-shadow:0 0 0 .22em #7ec8ff,0 .3em .8em rgba(60,140,240,.35)}
.card.ready{box-shadow:0 0 0 .22em var(--gold),0 0 .9em .1em rgba(255,207,90,.7)}
.card.selectable,.ccard.selectable{box-shadow:0 0 0 3px var(--gold),0 0 14px 3px rgba(255,190,60,.85);animation:pulse 1.1s ease-in-out infinite}
.card.chosen{box-shadow:0 0 0 3px var(--up),0 0 12px 2px rgba(19,137,90,.7);animation:none}
.ccard.chosen{box-shadow:0 0 0 3px var(--up),0 0 14px 3px rgba(19,137,90,.75);animation:none}
.card.fxhide{visibility:hidden}
.z-field .card{touch-action:none}
#ctray{position:absolute;left:320px;top:250px;width:960px;z-index:46;background:rgba(22,26,54,.96);border-radius:22px;padding:16px 20px 16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 22px 60px rgba(20,16,50,.5),0 0 0 1px rgba(255,255,255,.08);color:#fff;animation:ccpin .22s cubic-bezier(.2,.8,.3,1)}
@keyframes ccpin{from{transform:translateY(14px) scale(.97);opacity:0}}
.ccp-head{display:flex;align-items:center;gap:14px}
.ccp-head b{font-size:15px}
.ccp-dir{margin-left:auto;display:flex;gap:18px;font-size:11.5px;font-weight:700;color:#aeb3dc}.ccp-dir i{font-style:normal}
.ccp-x{border:0;background:rgba(255,255,255,.12);color:#fff;width:28px;height:28px;border-radius:8px;font-size:17px;cursor:pointer;line-height:1}
.ccp-row{display:flex;gap:12px;justify-content:center}
.ccp-c{appearance:none;border:0;background:none;padding:0;color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;width:116px;transition:transform .14s}
.ccp-c:disabled{cursor:default;opacity:.35}
.ccp-c:not(:disabled):hover{transform:translateY(-6px)}
.ccp-card{position:relative;width:104px;height:145px;border-radius:5px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.ccp-c.down .ccp-card{background:linear-gradient(160deg,#f6b7c9,#f9d7a8 30%,#f4eea6 48%,#b9e6c8 64%,#b7dcf4 80%,#d2c2ef)}
.ccp-c.up .ccp-card{background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 70%,#fff),var(--cc) 60%)}
.ccp-c.gone .ccp-card{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);border:1.5px dashed rgba(255,255,255,.3)}
.ccp-img{position:absolute;inset:0;background-size:cover;background-position:center}
.ccp-l{font-family:var(--f-num);font-size:40px;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.25)}
.ccp-c.down .ccp-l{font-style:italic}
.ccp-n{font-style:normal;font-size:12px;font-weight:700}
.ccp-tag{position:absolute;left:6px;top:6px;font-style:normal;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;background:rgba(0,0,0,.35);padding:1px 7px 1px 2px;border-radius:999px}
.ccp-tag b{width:18px;height:18px;border-radius:50%;background:var(--cc);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-num);box-shadow:0 0 0 1.5px #fff}
.ccp-empty{font-style:normal;font-size:11px;color:#aeb3dc}
.ccp-c.on .ccp-card{box-shadow:0 0 0 4px var(--up),0 0 24px 6px rgba(19,200,120,.6)}
.ccp-c.on{transform:translateY(-8px)}
.ccp-pos{font-size:11.5px;font-weight:700;color:#cfd2f2}
.ccp-c em{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.ccp-c em.ok{color:#7ef0b4}.ccp-c em.no{color:#ff9a9a}.ccp-c em.none{opacity:.4}
.ccp-foot{display:flex;align-items:center;gap:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.ccp-msg{flex:1;font-size:13px;color:#dfe0f6}
.z-cl.cltarget .clcol{border-radius:8px;box-shadow:0 0 0 3px var(--gold),0 0 18px 4px rgba(255,190,60,.7);animation:pulse 1.1s ease-in-out infinite}
.z-cl.droptgt .clcol{border-radius:8px;box-shadow:0 0 0 3px #ff4f8b,0 0 22px 6px rgba(255,79,139,.7)}
.z-cl.p1{cursor:pointer}
.fslot.drop .card,.card.droptgt{box-shadow:0 0 0 4px #fff,0 0 22px 6px var(--gold)!important}
.fxfloat.ko{color:#fff;font-family:var(--f-jp);font-size:28px;font-weight:900;-webkit-text-stroke:1px rgba(20,10,40,.6);text-shadow:0 3px 0 rgba(214,51,122,.85),0 0 16px rgba(0,0,0,.35)}
.card.chosen::after{content:"✓";position:absolute;right:.3em;top:2em;background:var(--up);color:#fff;border-radius:50%;width:1.6em;height:1.6em;font-size:1em;display:flex;align-items:center;justify-content:center}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--gold),0 0 3px 0 rgba(255,190,60,.25)}}
.status{position:absolute;left:0;right:0;top:2em;display:flex;flex-direction:column;align-items:flex-end;gap:.2em;padding-right:.2em;pointer-events:none}
.status span{font-size:.75em;font-weight:700;background:#0e1828;color:var(--gold);padding:0 .35em;border-radius:.2em}
.status span.lock{color:#ff9b9b}
.back{position:absolute;inset:0;border-radius:inherit;background:var(--navy);border:1px solid #3a4c74;overflow:hidden;
  background-image:radial-gradient(circle at 50% 42%,#2c3c62 0,#1c2440 70%)}
.back::after{content:"";position:absolute;left:22%;right:22%;top:28%;height:22%;border-radius:999px 999px 0 0;border:.28em solid transparent;border-bottom:0;
  background:linear-gradient(90deg,var(--R),var(--O),var(--Y),var(--G),var(--B),var(--I),var(--V)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.back.sm::after{border-width:.18em}

/* channel card (horizontal) */
.chcard{width:176px;height:126px;border-radius:7px;background:var(--navy);color:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 3px 10px rgba(25,20,60,.3);position:relative}
.chcard.sun{--cls:var(--sun)} .chcard.moon{--cls:var(--moon)} .chcard.comet{--cls:var(--comet)} .chcard.star{--cls:var(--star)}
.chcard .ch-head{background:var(--cls);display:flex;justify-content:space-between;align-items:center;padding:5px 10px;font-family:var(--f-jp);font-weight:900;font-size:15px}
.chcard .ch-head em{font-style:normal;font-family:var(--f-num);font-size:9px;letter-spacing:.2em;font-weight:600;opacity:.9}
.chcard .ch-body{flex:1;padding:7px 10px;display:flex;flex-direction:column;gap:6px;position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--cls) 26%,#1d2c44),#121d2e)}
.chcard .glyph{position:absolute;right:6px;bottom:-8px;font-family:var(--f-jp);font-weight:900;font-size:58px;line-height:1;color:rgba(255,255,255,.12)}
.ch-trig{display:flex;gap:4px;align-items:center;font-size:11px;color:#c9d4e3;position:relative}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:17px;padding:0 4px;border-radius:4px;background:var(--cc);color:#fff;font-family:var(--f-num);font-weight:700;font-size:11px;font-style:normal}
.tags{display:flex;flex-wrap:wrap;gap:3px;position:relative}
.tag{font-size:10px;font-family:var(--f-jp);font-weight:700;background:#0e1828;color:#fff;border-radius:8px;padding:0 6px;line-height:16px}
.chcard .use{font-size:10.5px;color:var(--gold);font-weight:700;position:relative}
.chcard.ready{box-shadow:0 0 0 3px var(--gold),0 0 14px 2px rgba(255,207,90,.7)}
.chcard.picked{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--focus)}

/* ---------- zones ---------- */
.z{position:absolute}
.zlab{font-size:11px;font-weight:700;color:#a8577f;letter-spacing:.06em}
.z-field{left:180px;width:1240px;height:124px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 30px;
  border:1.5px dashed var(--zline);border-radius:18px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.3) 50%,rgba(255,255,255,.12));transition:box-shadow .2s,background .2s}
.z-field.p1{flex-direction:row-reverse}
.z-field.p0{top:478px}.z-field.p1{top:298px}
.fslot{width:124px;height:124px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
#stage.dragplay .z-field.p0{border:2px solid var(--accent);background:rgba(214,51,122,.12);box-shadow:0 0 0 4px rgba(214,51,122,.15),0 0 26px rgba(214,51,122,.3)}
#stage.dragplay .z-field.p0 .fempty{display:none}
#stage.dragplay .z-field.p0::after{content:"여기에 놓아서 플레이";position:absolute;right:40px;top:50%;transform:translateY(-50%);font-size:15px;font-weight:700;color:var(--accent);pointer-events:none}
#stage.dragplay.overfield .z-field.p0{background:rgba(214,51,122,.22)}
#stage.dragset .z-set.p0{border:2px solid var(--accent);background:rgba(214,51,122,.14);box-shadow:0 0 24px rgba(214,51,122,.35)}
.hcard.dragging{opacity:.25}
.fxghost.dragp{z-index:6}
.fxghost.dragp .card{--s:1.5;box-shadow:0 18px 40px rgba(30,20,60,.45);transform:rotate(-3deg)}
.fslot .card{--s:var(--fs,1.33)}
.fcap{position:absolute;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;pointer-events:none;font-family:var(--f-num);font-size:11px;letter-spacing:.24em;color:#a8577f;font-weight:700}
.z-field.p0 .fcap{left:8px}.z-field.p1 .fcap{right:8px}
.fempty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:#b06d8f;pointer-events:none;white-space:nowrap}

.boxz{width:124px;height:132px;border-radius:12px;border:1.5px dashed var(--zline);background:var(--zone);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.boxz .note{font-size:11px;color:var(--ink-3)}
.boxz .card{--s:1.18}
.z-set.p0{left:470px;top:612px}.z-set.p1{left:1006px;top:156px}
.z-stage.p0{left:1006px;top:612px}.z-stage.p1{left:470px;top:156px}
.setback{position:relative;width:70px;height:100px;border-radius:7px;font-size:12px}
.under{font-family:var(--f-num);font-size:11.5px;color:var(--ink-2);font-weight:600}
.z-ch{width:176px;height:126px}
.z-ch.p0{left:712px;top:615px}.z-ch.p1{left:712px;top:159px}

.z-cl{width:132px;height:300px;display:flex;gap:6px}
.z-cl.p0{left:20px;top:468px}.z-cl.p1{left:1448px;top:132px;flex-direction:row-reverse}
.clcol{position:relative;width:107px;height:300px;flex:none}

.clcap{writing-mode:vertical-rl;font-size:11px;font-weight:700;letter-spacing:.22em;color:#a8577f;text-align:center}
.ccard{--cw:107px;--ch:75px;--step:37.5px;width:var(--cw);height:var(--ch);border-radius:4px;position:absolute;left:0;top:calc(var(--i)*var(--step));overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.08);transition:left .14s ease,box-shadow .14s}
.z-cl.p1 .ccard{top:calc((6 - var(--i))*var(--step))}
.z-cl.p0 .ccard:not(.gone):hover,.z-cl.p0 .ccard.chosen,.z-cl.p0 .ccard.droptgt{left:8px;z-index:20!important}
.z-cl.p1 .ccard.chosen{left:-10px;z-index:20!important}
#stage.dragatk .z-cl .ccard:hover{left:0}
.z-cl .ccard.droptgt{box-shadow:inset 0 0 0 3px #ff4f8b,0 0 0 3px #ff4f8b,0 0 18px 4px rgba(255,79,139,.7)}
.z-cl .ccard.selectable{box-shadow:inset 0 0 0 3px var(--gold),0 0 12px 2px rgba(255,190,60,.8)}
.z-cl .ccard.chosen{box-shadow:inset 0 0 0 3px var(--up),0 0 0 2px var(--up),0 0 16px 4px rgba(19,137,90,.75)}
.ccard .cimg{position:absolute;left:calc((var(--cw) - var(--ch))/2);top:calc((var(--ch) - var(--cw))/2);width:var(--ch);height:var(--cw);background-size:cover;background-position:center;transform:rotate(-90deg);pointer-events:none}
.z-cl.p1 .ccard .cimg{transform:rotate(90deg)}

/* render-driven animations (survive re-renders via negative animation-delay) */
.hcard.a-deal{animation:deal calc(.52s * var(--fxk,1)) cubic-bezier(.2,.8,.3,1) backwards}
@keyframes deal{from{transform:translate(calc(var(--x) + var(--dx)),var(--dy)) rotate(-10deg) scale(.55);opacity:0}25%{opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
.oback.a-deal{animation:odeal calc(.48s * var(--fxk,1)) cubic-bezier(.2,.8,.3,1) backwards}
@keyframes odeal{from{transform:translate(calc(var(--x) + var(--dx)),var(--dy)) rotate(10deg) scale(.6);opacity:0}25%{opacity:1}to{transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.fslot.a-pop{animation:pop calc(.55s * var(--fxk,1)) cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes pop{from{transform:translateY(-34px) scale(1.45);opacity:0;filter:brightness(2.2)}55%{opacity:1}to{transform:none;filter:none}}
.fslot.a-pop::after{content:"";position:absolute;inset:-6px;border-radius:16px;border:3px solid var(--gold);animation:popring calc(.7s * var(--fxk,1)) ease-out forwards;pointer-events:none;animation-delay:inherit}
@keyframes popring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.fslot.a-lungeU{animation:lungeU calc(.42s * var(--fxk,1)) ease-in-out}
.fslot.a-lungeD{animation:lungeD calc(.42s * var(--fxk,1)) ease-in-out}
@keyframes lungeU{40%{transform:translateY(-26px) scale(1.08)}}
@keyframes lungeD{40%{transform:translateY(26px) scale(1.08)}}
.fslot.a-hit{animation:hit calc(.45s * var(--fxk,1)) ease-in-out}

/* ---------- 글씨 크기(--fs) · 손패 크기(--hs) ---------- */

/* ---------- login ---------- */
.auth{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:0;height:100%}
.auth-art{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a2150 0%,#3b2463 45%,#5a2a6e 100%);padding:56px 60px;display:flex;flex-direction:column;gap:12px}
.auth-art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 25%,rgba(255,120,190,.45),transparent 45%),radial-gradient(circle at 10% 100%,rgba(90,160,255,.35),transparent 50%)}
.auth-art>*{position:relative;z-index:2}
.auth-art .lb-logo small{color:rgba(255,255,255,.85)}
.auth-tag{margin:0;color:rgba(255,255,255,.75);font-size:16px}
.auth-kv{margin-top:auto;width:100%;max-width:900px}
.auth-art .copy{color:rgba(255,255,255,.6);text-align:left;margin-top:14px}
.auth-art .hf0{left:10%;top:38%;transform:rotate(-12deg)}
.auth-art .hf1{left:32%;top:31%;transform:rotate(3deg);z-index:2}
.auth-art .hf2{left:54%;top:40%;transform:rotate(14deg)}
.auth-panel{background:var(--paper);padding:56px 64px;display:flex;flex-direction:column;gap:14px;overflow:auto;box-shadow:-20px 0 50px rgba(40,20,80,.12)}
.auth-panel h2{margin:0 0 6px;font-size:30px;font-weight:900;letter-spacing:-.02em}
.aform{display:flex;flex-direction:column;gap:12px;margin:0}
.af{display:flex;flex-direction:column;gap:6px}
.af span{font-size:13px;font-weight:700;color:var(--ink-2)}
.af input{font:inherit;font-size:16px;padding:13px 15px;border-radius:12px;border:1.5px solid rgba(120,90,140,.28);background:#fff;color:var(--ink)}
.af input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(214,51,122,.15)}
.btn.wide{width:100%;justify-content:center}
.alinks{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.alinks i{width:1px;height:12px;background:rgba(120,90,140,.3)}
.alink{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:4px 2px}
.alink:hover{color:var(--accent);text-decoration:underline}
.auth-panel>.alink{align-self:flex-start}
.aor{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;margin:6px 0}
.aor::before,.aor::after{content:"";flex:1;height:1px;background:rgba(120,90,140,.2)}
.gbtn{display:flex;align-items:center;gap:10px;background:#fff!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px rgba(120,90,140,.25)!important}
.gbtn svg{width:20px;height:20px}
.btn.ghost{background:transparent!important;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px rgba(120,90,140,.25)!important}
.hint.c{text-align:center;margin:0}
.amsg2{margin:0;font-size:13.5px;padding:10px 12px;border-radius:10px;line-height:1.45}
.amsg2.err{background:#fde9ee;color:#b0213f}.amsg2.ok{background:#e6f5ee;color:var(--up)}
.apara{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.aids{display:flex;flex-direction:column;gap:8px;background:#f7f1f8;border-radius:14px;padding:12px}
.aids small{font-size:12px;color:var(--ink-2);font-weight:700}
.aid{display:flex;align-items:center;justify-content:space-between;border:0;font:inherit;font-size:15px;font-weight:700;background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(120,90,140,.15)}
.aid span{font-size:12px;font-weight:600;color:var(--accent)}
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.home-start,.htile,.mcard{transition:none}.ld-spin{animation:none}}

/* ---------- 스테이지·채널 아래 카드 · 덱 아래 순서 ---------- */
.ustk{position:relative;isolation:isolate;display:inline-block}
.ustk>.card{position:relative;z-index:1}
.ustk .ub{position:absolute;inset:0;z-index:0;border-radius:8px;background:linear-gradient(160deg,#3b3f7a,#1c2440);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 2px 6px rgba(20,20,60,.35);transform:translate(calc(var(--i) * 4px),calc(var(--i) * 5px))}
.z-stage.boxz{overflow:visible}
.z-stage .under{background:var(--navy);color:#fff;padding:1px 9px;border-radius:999px;font-size:11px;margin-top:6px}
.chstk{position:absolute;inset:0;pointer-events:none;z-index:0}
.chstk i{position:absolute;inset:0;border-radius:8px;background:linear-gradient(160deg,#3b3f7a,#1c2440);box-shadow:0 0 0 1px rgba(255,255,255,.35);transform:translate(calc(var(--i) * 5px),calc(var(--i) * 5px))}
.z-ch>.chcard{position:relative;z-index:1}
.a-tuck{animation:tuck calc(.42s * var(--fxk,1)) ease-out}
@keyframes tuck{0%{transform:translateY(0)}35%{transform:translateY(-5px) scale(1.04)}100%{transform:none}}
.ordc{position:relative;cursor:pointer}
.ordc .ordn{position:absolute;left:50%;top:-30px;transform:translateX(-50%);z-index:5}
.ordn{min-width:30px;height:30px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-family:var(--f-num);font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(214,51,122,.5)}
.ordn.q{background:#6b6f93;box-shadow:0 0 0 3px rgba(255,255,255,.7);font-size:15px}
.ordc.on .card{opacity:.92}
#tray .row:has(.ordc){padding-top:30px;gap:12px}
.ordprev{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;color:#dfe0f6;font-size:12.5px;padding-top:4px;border-top:1px solid rgba(255,255,255,.12)}
.ordprev .opl{opacity:.75;margin-right:4px}
.ordprev i{font-style:normal;opacity:.5}
.ops{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:4px 10px 4px 4px;border-radius:999px;max-width:180px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ops b{width:20px;height:20px;border-radius:50%;background:#6b6f93;color:#fff;font-family:var(--f-num);font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ops.on b{background:var(--accent)}
.ops em{font-style:normal;font-size:11px;font-weight:800;color:var(--gold);margin-left:2px}
.undlist{display:flex;flex-wrap:wrap;gap:26px;padding:36px 0 6px;justify-content:center}
.undc{position:relative}.undc .ordn{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:3}

/* ---------- 화면 리소스 ---------- */
.lg-img{display:block;height:40px;width:auto;max-width:520px;object-fit:contain}
.lb-logo.big .lg-img{height:96px;max-width:720px}
.boot .lg-img{height:110px}
#stage.r-lobby #lobby{background-image:linear-gradient(rgba(246,233,245,.55),rgba(246,233,245,.55)),var(--res-lobby);background-size:cover;background-position:center}
#stage.r-board{background:var(--res-board) center/cover no-repeat}
.home-hero.img,.auth-art.img{background-size:cover;background-position:center}
.home-hero.img::before,.home-hero.img::after{opacity:.35}
.auth-art.img::before{opacity:.45}
.mcard.img{background-size:cover!important;background-position:center!important}
.mcard.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,30,.05) 30%,rgba(10,8,30,.72));z-index:0}
.mcard.img>*{position:relative;z-index:1}.mcard.img .soon{position:absolute}
.cf.img{background-size:cover;background-position:center}
.resbox{flex:1;min-height:0;overflow-y:auto;padding-right:6px}
.rslots{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))!important;flex:none!important;overflow:visible!important;min-height:auto!important;margin-bottom:10px}
.rslot{padding:10px 8px!important;background:rgba(255,255,255,.6)}
.rslot .uiprev{height:120px;width:auto;max-width:100%;flex:none;border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#efe7f2 0 25%,#fff 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(120,90,140,.18)}
.rslot .uiprev.round{border-radius:50%}
.uiprev img{width:100%;height:100%;object-fit:cover;display:block}
.uiprev.free img{object-fit:contain}
.uiprev span{font-size:12px;color:var(--ink-3);font-weight:700}
.rslot .sid{white-space:normal;line-height:1.35}

/* ---------- 로비 UX ---------- */
.lb-head{gap:14px}
.lb-back{padding:8px!important;width:40px;height:40px;justify-content:center}
.lb-nav{display:flex;gap:2px;background:rgba(255,255,255,.7);padding:4px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(120,90,140,.14)}
.lb-nav button{border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--ink-2);padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lb-nav button:hover{color:var(--ink);background:rgba(255,255,255,.8)}
.lb-nav button.on{background:var(--navy);color:#fff}
.lb-nav button.adm{color:var(--accent)}.lb-nav button.adm.on{background:var(--accent);color:#fff}
.lb-mode{background:#fff;box-shadow:inset 0 0 0 1px rgba(120,90,140,.16)}
.lb-mode button{padding:7px 16px}
.lb-mode button.on{background:var(--accent);color:#fff}
.home-quick{position:relative;z-index:3;display:flex;align-items:center;gap:14px;border:0;cursor:pointer;font:inherit;text-align:left;color:#fff;width:100%;padding:14px 20px;border-radius:18px;
  background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);backdrop-filter:blur(6px);transition:background .15s}
.home-quick:hover{background:rgba(255,255,255,.2)}
.hq-ic{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.hq-ic svg{width:18px;height:18px;fill:#fff;margin-left:3px}
.hq-tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}.hq-tx b{font-size:17px}.hq-tx small{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hq-tx i{font-style:normal;opacity:.7;margin:0 2px}
.hq-go{font-size:22px;font-weight:800;opacity:.8}
.hh-l{gap:14px!important}
.dl-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.lb-startbtn kbd{font:inherit;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.mcard.last{outline:3px solid var(--gold);outline-offset:4px}
.mcard.last .mc-go::after{content:" · 지난번 선택"}

/* 이미지 길게 누르기(모바일) 메뉴·끌기 막기 */
img{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}

/* ---------- 홈 배너 ---------- */
.bnr{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:rgba(10,8,30,.35);box-shadow:0 18px 44px rgba(10,5,30,.45),0 0 0 1px rgba(255,255,255,.16)}
.bn-s{position:absolute;inset:0;display:block;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.bn-s.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.bn-s img{width:100%;height:100%;object-fit:cover;display:block}
a.bn-s{cursor:pointer}.bn-s.nolink{cursor:default}
.bn-go{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(10,8,30,.55);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;opacity:0;transition:opacity .2s}
a.bn-s:hover .bn-go,a.bn-s:focus-visible .bn-go{opacity:1}
a.bn-s:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.bn-dots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px;z-index:2;pointer-events:none}
.bn-dots button{pointer-events:auto;width:10px;height:10px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.55);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:width .25s,background .25s}
.bn-dots button.on{width:26px;background:#fff}
.bn-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(10,8,30,.5);color:#fff;font-size:26px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s}
.bnr:hover .bn-nav,.bn-nav:focus-visible{opacity:1}
.bn-nav.prev{left:12px}.bn-nav.next{right:12px}
.auth-kv .bnr{border-radius:16px}
@media (prefers-reduced-motion:reduce){.bn-s,.bn-s.on{transition:none}}
.bnadm{display:flex;flex-direction:column;gap:10px;margin:0 0 10px}
.bnrow{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.75);border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px rgba(120,90,140,.14);border:1.5px dashed transparent}
.bnrow.drop{border-color:var(--accent);background:rgba(214,51,122,.06)}
.bnth{width:224px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;flex:none;background:repeating-conic-gradient(#efe7f2 0 25%,#fff 0 50%) 0 0/16px 16px;display:flex;align-items:center;justify-content:center}
.bnth img{width:100%;height:100%;object-fit:cover;display:block}.bnth span{font-size:12px;color:var(--ink-3);font-weight:700}
.bnf{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.bnf>b{font-size:15px}.nolinkt{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);background:#f1e9f3;padding:2px 8px;border-radius:999px;margin-left:6px}
.bnurl{display:flex;align-items:center;gap:10px}.bnurl span{font-size:12.5px;font-weight:700;color:var(--ink-2);flex:none}
.bnurl input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1.5px solid rgba(120,90,140,.25);background:#fff;color:var(--ink)}
.bnurl input:focus{outline:none;border-color:var(--accent)}
.bnbtns{display:flex;gap:6px;flex-wrap:wrap}
.bnadd{border:2px dashed rgba(120,90,140,.3);background:transparent;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:var(--ink-2);cursor:pointer}
.bnadd:hover{border-color:var(--accent);color:var(--accent)}

/* ================= 모바일·폴드 ================= */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none}
button,a,[role=button]{-webkit-tap-highlight-color:transparent}
/* 작은 화면: 바깥 여백 없이 화면 전체 사용 (노치·홈 바 안전 영역만 비움) */
@media (max-width:1199px),(max-height:659px){
 body{padding:0;height:100vh;height:100dvh}
 #app{box-sizing:border-box;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0)}
}
#toolbar{zoom:var(--mob2,1)}
.bubble{zoom:var(--mob2,1)}
#centerbar .btn{zoom:var(--mob2,1)}
.coin-box{max-width:calc(100% - 24px);box-sizing:border-box;zoom:calc(var(--fs,1) * var(--mob,1))}
#ldov .ld-box{max-width:calc(100% - 32px);box-sizing:border-box}
#rotate{position:absolute;inset:0;left:0;bottom:0;transform:none;z-index:200;background:rgba(20,16,44,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;white-space:normal;border-radius:0;font-size:15px}
#rotate[hidden]{display:none}
#rotate b{font-size:22px}#rotate p{margin:0;opacity:.8;max-width:300px;line-height:1.5}
.rot-btns{display:flex;flex-direction:column;gap:10px;margin-top:8px;width:min(300px,100%)}
.rot-btns .btn{padding:13px 18px;font-size:15px}
.rot-ph{width:54px;height:90px;border:4px solid #fff;border-radius:12px;position:relative;animation:rotph 2.4s ease-in-out infinite}
.rot-ph i{position:absolute;left:50%;bottom:6px;width:14px;height:3px;border-radius:2px;background:#fff;transform:translateX(-50%)}
@keyframes rotph{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.rot-ph{animation:none;transform:rotate(-90deg)}}

/* 작은 화면: 카드 크게 보기 */

const $=s=>document.querySelector(s);
let RNG=Math.random; // 멀티 대전에서는 양쪽이 같은 시드의 난수를 씀
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=RNG()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const D=c=>CARDS[c.id];
const nm=c=>D(c).name;
const hasTag=(c,t)=>(D(c).tags||[]).includes(t);
const power=c=>(D(c).power||0)+(c.buff||0);
const val=c=>{const d=D(c);return d.type==='liver'?d.lv*8+d.colors.length*3+power(c)/1500:10+d.lv*3};
const maxBy=(a,f)=>a.reduce((b,x)=>f(x)>f(b)?x:b,a[0]);
const minBy=(a,f)=>a.reduce((b,x)=>f(x)<f(b)?x:b,a[0]);
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
class GameOver extends Error{}
class Abort extends Error{}
let TOKEN={dead:false};
let SPEED=1;
let G=null, UI={}, uidc=0, SEL={uids:new Set(),cl:new Set()};
function sleep(ms){const t=TOKEN;if(SPEED===0)return t.dead?Promise.reject(new Abort()):Promise.resolve();return new Promise((res,rej)=>setTimeout(()=>t.dead?rej(new Abort()):res(),ms*SPEED))}
function mkCard(id,owner){return{uid:++uidc,id,owner,tapped:false,noUntap:false,buff:0,entered:-1,noCC:false,once:{}}}
function reset(c){c.tapped=false;c.noUntap=false;c.buff=0;c.noCC=false;c.once={}}
function take(arr,u){const i=arr.findIndex(x=>x.uid===u);return i<0?null:arr.splice(i,1)[0]}
function onField(c){return G.p[c.owner].field.includes(c)}
function byUid(u){
  for(const P of G.p){
    for(const z of [P.hand,P.field,P.log,P.deck,P.under,P.chUnder||[]]){const c=z.find(x=>x.uid===u);if(c)return c}
    if(P.stage&&P.stage.uid===u)return P.stage; if(P.ch.uid===u)return P.ch; if(P.set&&P.set.uid===u)return P.set;
  }
  return (G.reveal||[]).find(x=>x.uid===u)||((G.look&&G.look.cards)||[]).find(x=>x.uid===u)||null;
}
function zoneOf(c){const P=G.p[c.owner];
  if(P.hand.includes(c))return'hand'; if(P.field.includes(c))return'field'; if(P.log.includes(c))return'log';
  if(P.stage===c)return'stage'; if(P.ch===c)return'channel'; if(P.set===c)return'set'; if(P.under.includes(c))return'under'; if((P.chUnder||[]).includes(c))return'chunder';
  if((G.reveal||[]).includes(c))return'reveal'; if(G.look&&G.look.cards.includes(c))return'look'; return'deck'}
function log(msg,pid,kind){G.logs.unshift({msg,pid,kind});if(G.logs.length>300)G.logs.length=300}

/* ================= ENGINE ================= */
function newGame(cfg){
  TOKEN.dead=true; TOKEN={dead:false}; uidc=0;
  RNG=cfg.mp?mulberry32(cfg.mp.seed>>>0):Math.random;
  const mk=(pid,deckId,ai)=>{const dk=deckId&&typeof deckId==='object'?deckId:getDeck(deckId);const deck=[];
    for(const [id,n] of Object.entries(dk.list))for(let i=0;i<n;i++)deck.push(mkCard(id,pid));
    shuffle(deck);
    return{pid,name:ai&&pid===1?'AI':(ai?'AI-1':'나'),ai,deckId,deckShort:dk.short,deck,hand:[],field:[],log:[],stage:null,under:[],chUnder:[],set:null,
      cl:shuffle(COLORS.map(c=>({color:c,up:false,gone:false}))),niji:[],ch:mkCard(dk.ch,pid),once:{},turns:0}};
  let ps;
  if(cfg.mp){ // 카드 uid·셔플 순서를 양쪽이 같게: 항상 방장 → 참가자 순으로 만든다
    let a,b;if(cfg.mp.role==='host'){a=mk(0,cfg.me,false);b=mk(1,cfg.opp,false)}else{b=mk(1,cfg.opp,false);a=mk(0,cfg.me,false)}
    a.name='나';b.name=cfg.mp.oppName||'상대';b.remote=true;ps=[a,b];
  }else ps=[mk(0,cfg.me,!!cfg.ai0),mk(1,cfg.opp,true)];
  G={p:ps,cur:0,first:0,turnNo:0,phase:'setup',winner:null,reason:'',logs:[],reveal:null,cfg};
  UI={sel:null,pending:null,att:null,phaseRes:null,busy:false};
  const first=cfg.first==='me'?0:cfg.first==='ai'?1:(Math.random()<.5?0:1);
  G.first=first;G.cur=first;
  G.p[first].hand=G.p[first].deck.splice(0,5);
  G.p[1-first].hand=G.p[1-first].deck.splice(0,7);
}
async function ask(pid,req){
  if(G.p[pid].ai){await sleep(320);if(!G.cfg.sim&&AILV(pid)==='easy'&&Math.random()<0.35){const r=aiRandomAns(req);if(r!==undefined)return r}return req.ai()}
  if(G.p[pid].remote){ // 상대의 선택을 기다림
    UI.remoteWait=true;render();const m=await mpRecv();UI.remoteWait=false;render();
    if(!m||m.t!=='ans'||!mpValidAns(req,m.v)){mpEnd('상대의 응답이 규칙에 맞지 않아 대전을 멈춤',null);throw new Abort()}
    return m.v;
  }
  const t=TOKEN;
  const v=await new Promise(res=>{UI.pending={pid,req,res,sel:[]};render()});
  if(t.dead)throw new Abort();
  if(G.cfg.mp&&!req.local)mpSend({t:'ans',v:v===undefined?null:v});
  return v;
}
function humanWait(){const t=TOKEN;return new Promise(res=>{UI.phaseRes=()=>{if(G.cfg.mp)mpSend({t:'next'});res()};render()}).then(()=>{if(t.dead)throw new Abort()})}
function winGame(pid,reason){
  if(G.winner!=null)throw new GameOver();
  G.winner=pid;G.reason=reason;log(`${G.p[pid].name} 승리 — ${reason}`,pid,'win');
  if(G.cfg.sim)throw new GameOver();
  UI.pending=null;UI.phaseRes=null;UI.att=null;render();
  if(!G.cfg.headless)showWin();
  throw new GameOver();
}
async function runGame(){
  try{
    const f=G.p[G.first];
    log(`${f.name} 선공 (손패 5장) · ${G.p[1-G.first].name} 후공 (손패 7장)`,G.first);
    UI.hideHands=true;render();await fx('intro',{first:G.first});
    await mulliganAll();
    UI.hideHands=false;SEEN.dealCenter=true;render();SEEN.dealCenter=false;await fx('pause',{ms:1000});
    while(true){
      await takeTurn();
      G.cur=1-G.cur;
      if(G.turnNo>=160){G.winner=-1;G.reason='턴 제한';log('턴 제한으로 무승부');render();return}
    }
  }catch(e){
    if(e instanceof GameOver||e instanceof Abort)return;
    console.error(e);if(G)log('오류: '+e.message);(window.__errors=window.__errors||[]).push(String(e.stack||e));render();
  }
}
function mullReq(pid){const P=G.p[pid];
  return{kind:'mulligan',text:`손패를 다시 뽑을지 선택 (1회 한정 · 손패 ${P.hand.length}장)`,
    ai:()=>aiMulligan(P)}}
function mullApply(pid,again){const P=G.p[pid];
  if(again){const n=P.hand.length;P.deck.push(...P.hand);P.hand=[];shuffle(P.deck);P.hand=P.deck.splice(0,n);fxRedeal(pid);log(`손패를 다시 뽑음 (${n}장)`,pid);render()}

/* ================= AI ================= */
function keepVal(c){const d=D(c);
  if(d.type==='liver')return d.lv===0?4:d.lv*7+d.colors.length*3+(d.blocker?6:0);
  if(d.type==='event')return 22;
  return 14}
function aiBuffTarget(pid,amt,pool){
  const O=G.p[1-pid];const ready=pool.filter(a=>!a.tapped);
  for(const a of [...ready].sort((x,y)=>power(y)-power(x)))
    if(O.field.some(t=>t.tapped&&power(t)>=power(a)&&power(t)<power(a)+amt))return a.uid;
  return (ready.length?maxBy(ready,power):maxBy(pool,power)).uid;
}
function aiDebuffTarget(pid,amt){
  const P=G.p[pid],O=G.p[1-pid];const myMax=Math.max(0,...P.field.filter(a=>!a.tapped).map(power));
  const k=O.field.filter(t=>t.tapped&&power(t)>=myMax&&power(t)-amt<myMax);
  return (k.length?maxBy(k,val):maxBy(O.field,val)).uid;
}
function aiPickColor(c,idxs,O){
  const sure=idxs.filter(i=>O.cl[i].up&&D(c).colors.includes(O.cl[i].color));if(sure.length)return sure[0];
  const down=idxs.filter(i=>!O.cl[i].up);if(down.length)return down[Math.random()*down.length|0];
  return idxs[0];
}
function aiBlock(def,att,tg,blockers){
  const pa=power(att);
  const winners=blockers.filter(b=>power(b)>pa);
  if(winners.length)return minBy(winners,val).uid;
  if(tg.kind==='color'){
    const cc=G.p[def].cl[tg.idx];
    const certain=cc.up&&D(att).colors.includes(cc.color);
    const desperate=G.p[def].niji.length>=5;
    if(certain||desperate)return minBy(blockers,val).uid;
  }
  return null;
}
function aiPay(P,c,n){
  return [...P.hand.filter(h=>h!==c)].sort((a,b)=>keepVal(a)-keepVal(b)).slice(0,n);
}
function aiBestPlay(pid,extra){
  const P=G.p[pid],O=G.p[1-pid];const cands=[];
  for(const c of [...P.hand,...(P.set?[P.set]:[])]){
    const d=D(c);if(d.lv>P.hand.length-(P.hand.includes(c)?1:0))continue;
    let s=-1;
    if(d.type==='liver'){if(P.field.length>=FIELD_MAX)continue;s=d.lv===0?16:20+d.lv*8+d.colors.length*4+d.power/1500+(d.blocker?4:0)}
    else if(d.type==='stage'){if(P.stage)continue;
      if(c.id==='SD01-016'){const jk=P.field.filter(x=>hasTag(x,'JK')).length;s=jk>=2?36:24}
      else if(c.id==='SD02-016'){if(P.deck.length<=12)continue;s=P.deck.length>20?36:28}
      else if(c.id==='SD04-016'){ // 앙코르 스테이지: 상대 컬러 카드가 거의 앞면이고 다시 꺼낼 #엔카운터 라이버가 있을 때 가치가 큼
        const down=O.cl.filter(x=>!x.gone&&!x.up).length;const back=P.log.some(x=>D(x).type==='liver'&&D(x).lv<=3&&hasTag(x,'エンカウンター'));
        s=down<=1&&back?55:down<=2&&back?36:22}
      else s=(extra&&extra[c.uid]!=null)?extra[c.uid]:21}
    else if(c.id==='SD01-015'){const t=O.field.filter(x=>x.tapped&&D(x).lv<=6);if(!t.length)continue;s=40+val(maxBy(t,val))}
    else if(c.id==='SD02-014'){const t=O.field.filter(x=>D(x).lv<=5&&power(x)<=10000);if(!t.length)continue;s=36+val(maxBy(t,val))}
    else if(c.id==='SD03-014'){const t=O.field.filter(x=>D(x).lv<=5);if(!t.length)continue;s=36+val(maxBy(t,val))}
    else if(c.id==='SD03-015'){const sv=a=>a.reduce((n,x)=>n+val(x),0);const diff=sv(O.field)-sv(P.field);if(O.field.length<2||diff<25)continue;s=42+diff/3}
    else if(c.id==='SD01-014'){
      const ready=P.field.filter(a=>!a.tapped);
      const ok=ready.some(a=>O.field.some(t=>t.tapped&&power(t)>=power(a)&&power(t)<power(a)+5000));
      if(!ok)continue;s=34}
    else if(c.id==='SD02-015'){
      const ready=P.field.filter(a=>!a.tapped);
      const kill=ready.some(a=>O.field.some(t=>t.tapped&&power(t)>=power(a)&&power(t)-3000<power(a)));
      const ex=P.field.length<FIELD_MAX&&P.log.some(x=>nm(x)==='엑스 알비오'&&D(x).lv<=2);
      if(!kill&&!ex)continue;s=kill?38:27}
    else if(extra&&extra[c.uid]!=null)s=extra[c.uid];
    else continue;
    const pay=aiPay(P,c,d.lv);
    if(pay.some(x=>keepVal(x)>(d.type==='stage'?Math.max(s,24):s)))continue;
    cands.push({c,s,pay});
  }
  if(!cands.length)return null;
  return maxBy(cands,x=>x.s);
}

  const lv=AILV(pid);
  if(lv==='hard'||lv==='expert')return aiMainSearch(pid,lv);
  if(lv==='easy')return aiMainEasy(pid);
  const P=G.p[pid];
  for(let g=0;g<14;g++){
    await sleep(420);

    if(canActivate(pid,'st')&&(P.stage.id!=='SD02-016'||P.deck.length>10)){await activate(pid,'st');continue}

    const plan=aiBestPlay(pid,extra);if(!plan)break;

function aiChooseTarget(pid,a){
  const O=G.p[1-pid];const pa=power(a);
  const kill=O.field.filter(t=>t.tapped&&power(t)<pa);
  if(kill.length)return{kind:'liver',uid:maxBy(kill,val).uid};
  if(a.noCC||!D(a).colors.length)return null;
  const open=O.cl.map((x,i)=>({x,i})).filter(o=>!o.x.gone);
  const sure=open.filter(o=>o.x.up&&D(a).colors.includes(o.x.color));
  const blk=O.field.filter(x=>!x.tapped&&D(x).blocker);
  const blkWins=blk.some(b=>power(b)>=pa);
  if(sure.length)return{kind:'color',idx:sure[0].i};
  const down=open.filter(o=>!o.x.up);
  if(!down.length)return null;
  if(blkWins&&D(a).colors.length<3&&O.field.length)return null;
  return{kind:'color',idx:down[Math.random()*down.length|0].i};
}
async function aiAction(pid){
  const lv=AILV(pid);

  if(lv==='easy')return aiActionEasy(pid);

    const atts=P.field.filter(c=>!c.tapped).sort((a,b)=>power(b)-power(a));if(!atts.length)break;
    let acted=false;
    for(const a of atts){
      const homeBlk=P.field.filter(x=>!x.tapped&&D(x).blocker).length;
      if(D(a).blocker&&homeBlk<=1&&O.field.some(x=>!x.tapped)&&P.field.length>1)continue;
      const tg=aiChooseTarget(pid,a);if(!tg)continue;
      await sleep(500);await doAttack(pid,a,tg);acted=true;break;
    }
    if(!acted)break;
  }
}
async function aiSet(pid){

/* ================= AI 난이도 =================
   쉬움: 아무 카드나 내고 아무 데나 공격하며, 선택도 가끔 무작위.
   보통: 카드별 판단 + 처음 보는 이벤트·스테이지는 써 본 결과로 판단.
   어려움·최상: 할 수 있는 행동을 하나씩 "가상의 판"에서 실제로 해 보고(카드 효과도 엔진이 그대로 처리),
   남은 턴과 상대의 다음 턴까지 진행해 본 뒤 판세 점수가 가장 좋은 행동을 고른다.
   카드 번호를 외우지 않고 엔진으로 직접 돌려 보기 때문에 앞으로 추가되는 카드(부스터 등)에도 그대로 동작한다.
   가상의 판에서는 상대 손패·덱 순서·뒷면 컬러 카드처럼 AI가 모르는 정보를 섞어서 쓰므로 몰래 보는 일은 없다. */
const AILVS=[['easy','쉬움'],['normal','보통'],['hard','어려움'],['expert','최상']];
const AILV_DESC={easy:'처음 하는 사람용 — 아무 카드나 내고 아무 데나 공격',normal:'카드마다 정해진 기준으로 판단',hard:'둘 수 있는 수를 직접 시험해 보고 상대의 다음 턴까지 계산해서 고름',expert:'어려움과 같은 계산을 여러 가지 경우로 반복해 가장 안전한 수를 고름 · 손패 기준도 엄격'};
const AILV=pid=>(G&&G.cfg&&!G.cfg.sim&&((pid!=null&&G.cfg['aiLv'+pid])||G.cfg.aiLv))||'normal'; // 플레이어별 지정(aiLv0·aiLv1)도 가능 — 테스트용
const AIPARAM={
  hard:{samples:2,opp:true,deep:false,margin:1.2,budget:700,colorReps:1},
  expert:{samples:6,opp:true,deep:true,margin:0.6,budget:1800,colorReps:2}}; // deep: 상대 턴 다음의 내 턴까지 봄
let SIMD=0,SIMERR=0;
function simRng(seed){return mulberry32((seed>>>0)||1)}
function simShuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* 지금 판을 복사하되, pid가 모르는 정보는 섞는다 */
function simClone(pid,seed){
  const logs=G.logs;G.logs=[];let C;try{C=structuredClone(G)}finally{G.logs=logs}
  C.cfg=Object.assign({},C.cfg,{headless:true,sim:true,mp:null});
  for(const P of C.p){P.ai=true;P.remote=false}
  const r=simRng(seed),O=C.p[1-pid],Me=C.p[pid];
  const pool=[...O.hand,...O.deck,...(O.set?[O.set]:[])];simShuffle(pool,r);
  O.hand=pool.splice(0,O.hand.length);if(O.set)O.set=pool.shift();O.deck=pool;
  simShuffle(Me.deck,r);
  for(const P of C.p){const down=P.cl.filter(x=>!x.up&&!x.gone);const cols=simShuffle(down.map(x=>x.color),r);down.forEach((x,i)=>x.color=cols[i])}
  return C;
}
/* 가상의 판에서 fn을 실행하고 pid 입장의 점수를 돌려준다. 끝나면 진짜 판으로 되돌림 */
async function simRun(pid,seed,fn){
  const sv={G,RNG,SPEED,uidc,TOKEN};let sc=0;
  const C=simClone(pid,seed);
  G=C;RNG=simRng(seed^0x9e3779b9);SPEED=0;TOKEN={dead:false};SIMD++;
  try{await fn(C)}catch(e){if(!(e instanceof GameOver||e instanceof Abort)){if(SIMERR++<3)console.warn('AI sim',e)}}
  finally{try{sc=evalState(C,pid)}catch(e){sc=0}G=sv.G;RNG=sv.RNG;SPEED=sv.SPEED;uidc=sv.uidc;TOKEN=sv.TOKEN;SIMD--}
  return sc;
}
/* 판세 점수 (카드 종류와 무관한 일반 기준) */
function evalState(S,pid){
  if(S.winner!=null)return S.winner===pid?1e5:S.winner===-1?0:-1e5;
  const me=S.p[pid],op=S.p[1-pid];
  const nj=k=>k*12+k*k*2.4; // 니지 에리어는 7이 되면 패배 — 쌓일수록 급하게 나빠짐
  let s=nj(op.niji.length)-nj(me.niji.length);
  const cols=P=>new Set(P.field.flatMap(c=>D(c).colors||[]));const mc=cols(me),oc=cols(op);
  const open=P=>P.cl.filter(x=>!x.gone&&x.up);
  s+=open(op).filter(x=>mc.has(x.color)).length*4.5-open(me).filter(x=>oc.has(x.color)).length*4.5; // 다음 컬러 콜이 확실한 자리
  s+=open(op).length*1.2-open(me).length*1.2;
  const lv=c=>{const d=D(c);if(d.type!=='liver')return 0;return power(c)/1000*1.1+(d.colors||[]).length*1.6+(d.blocker?2.5:0)+(c.tapped?0:1.4)+(d.lv||0)*0.5};
  const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
  s+=sum(me.field,lv)-sum(op.field,lv);
  s+=me.hand.length*1.6-op.hand.length*1.6+(me.set?1.4:0)-(op.set?1.4:0)+(me.stage?2.5:0)-(op.stage?2.5:0);
  if(me.deck.length<6)s-=(6-me.deck.length)*5;if(op.deck.length<6)s+=(6-op.deck.length)*5;
  return s;
}
/* 메인 페이즈에서 할 수 있는 행동 목록 (같은 카드는 한 번만) */
function aiMainActs(pid){
  const P=G.p[pid],acts=[],seen=new Set();
  for(const src of ['ch','st'])if(canActivate(pid,src))acts.push({k:'act',src});
  for(const c of [...P.hand,...(P.set?[P.set]:[])]){
    if(playBlock(pid,c))continue;const d=D(c);if((d.lv||0)>P.hand.length-(P.hand.includes(c)?1:0))continue;
    const key=c.id+(P.set===c?'s':'h');if(seen.has(key))continue;seen.add(key);
    acts.push({k:'play',uid:c.uid,pay:aiPay(P,c,d.lv||0).map(x=>x.uid)})}
  return acts;
}
async function aiDoMain(pid,a){if(a.k==='act')return activate(pid,a.src);const c=byUid(a.uid);if(c)return doPlay(pid,c,a.pay)}
/* 행동(step)을 한 뒤 남은 턴(from: 'tail'=액션 페이즈부터, 'set'=세트 페이즈부터)과 상대의 다음 턴까지
   보통 AI로 진행해 본 평균 점수. seeds마다 모르는 정보를 다르게 섞음 */
async function aiRollout(pid,seeds,prm,step,from){
  let t=0;for(const sd of seeds)t+=await simRun(pid,sd,async()=>{
    if(step)await step();
    if(G.winner==null){if(from==='tail')await turnTail(pid,'action');else if(from==='set')await turnTail(pid,'set');else if(from==='end')await turnTail(pid,'end')}
    if(prm.opp&&G.winner==null){G.cur=1-pid;await takeTurn()}
    if(prm.deep&&G.winner==null){G.cur=pid;await takeTurn()}});
  return t/seeds.length;
}
const aiSeeds=n=>Array.from({length:n},()=>crypto.getRandomValues(new Uint32Array(1))[0]);
async function aiMainSearch(pid,lv){
  const prm=AIPARAM[lv],P=G.p[pid];
  for(let g=0;g<12;g++){
    await sleep(380);if(G.winner!=null)return;
    const acts=aiMainActs(pid);if(!acts.length)return;
    const seeds=aiSeeds(prm.samples),t0=performance.now();
    // 기준: 더 내지 않고 바로 액션 페이즈로
    const base=await aiRollout(pid,seeds,prm,null,'tail');
    let best=null,bs=base+prm.margin;
    for(const a of acts){
      if(performance.now()-t0>prm.budget&&best)break;
      const sc=await aiRollout(pid,seeds,prm,()=>aiDoMain(pid,a),'tail');
      if(sc>bs){bs=sc;best=a}}
    if(!best)return;
    await aiDoMain(pid,best);
  }
}
/* 공격 후보: 라이버마다 (상대 라이버 / 앞면 컬러 카드 / 뒷면 컬러 카드 대표 몇 장) */
function aiAttackActs(pid,reps){
  const P=G.p[pid],O=G.p[1-pid],acts=[];
  for(const a of P.field){if(!canAttack(pid,a))continue;
    const ts=attackTargets(pid,a);const downs=ts.filter(t=>t.kind==='color'&&!O.cl[t.idx].up);
    const pick=new Set(simShuffle([...downs],Math.random).slice(0,reps));
    for(const t of ts){if(t.kind==='color'&&!O.cl[t.idx].up&&!pick.has(t))continue;acts.push({att:a.uid,tg:t.kind==='liver'?{kind:'liver',uid:t.uid}:{kind:'color',idx:t.idx}})}}
  return acts;
}
async function aiActionSearch(pid,lv){

    const seeds=aiSeeds(prm.samples),t0=performance.now();
    const base=await aiRollout(pid,seeds,prm,null,'set');
    let best=null,bs=base+prm.margin*0.5;
    for(const a of acts){
      if(performance.now()-t0>prm.budget*1.4&&best)break;
      const sc=await aiRollout(pid,seeds,prm,()=>doAttack(pid,byUid(a.att),a.tg),'set');
      if(sc>bs){bs=sc;best=a}}
    if(!best)return;

/* 세트 페이즈: 어떤 카드를 세트할지(또는 그대로 둘지)도 직접 시험해서 고름 */
async function aiSetSearch(pid,lv){

  const prm=AIPARAM[lv],seeds=aiSeeds(prm.samples);

    const sc=await aiRollout(pid,seeds,prm,()=>{const x=byUid(c.uid);if(x)setCard(pid,x)},'end');if(sc>bs+0.3){bs=sc;best=c.uid}}
  if(!P.set&&best==null)best=maxBy(P.hand,keepVal).uid; // 세트 칸이 비어 있으면 일단 채움
  if(best!=null){const x=byUid(best);if(x&&P.hand.includes(x))setCard(pid,x)}

/* 보통: 카드별 판단이 없는 이벤트·스테이지는 한 번 써 본 결과(바로 다음 판세)로 점수를 매김 */
const AI_KNOWN=new Set(['SD01-014','SD01-015','SD01-016','SD02-014','SD02-015','SD02-016','SD03-014','SD03-015','SD04-016']);
async function aiGenericScores(pid){
  const P=G.p[pid],out={};const cands=[...P.hand,...(P.set?[P.set]:[])].filter(c=>{const d=D(c);return(d.type==='event'||d.type==='stage')&&!AI_KNOWN.has(c.id)&&!playBlock(pid,c)});
  if(!cands.length)return out;

  for(const c of cands){const d=D(c);if(d.type==='stage'&&P.stage)continue;

    const gain=sc-base;if(gain>2)out[c.uid]=24+gain*1.5;

    if(d.type==='stage'&&!(c.uid in out)){const e=EFF[c.id];const passive=e&&Object.keys(e).some(k=>k!=='act'&&k!=='canAct');

        if(n>=3&&P.hand.length-(d.lv||0)>=2)out[c.uid]=20+Math.min(n,6)}}}

function parseTable(txt){
  txt=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');const first=txt.split('\n')[0]||'';const sep=first.includes('\t')?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"'&&cell==='')q=true;else if(ch===sep){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}

function tone(c,o){ // o: {f, f2, t, d, type, g, at}
  const t0=c.currentTime+(o.at||0);const osc=c.createOscillator();const g=c.createGain();
  osc.type=o.type||'sine';osc.frequency.setValueAtTime(o.f,t0);if(o.f2)osc.frequency.exponentialRampToValueAtTime(o.f2,t0+o.d);

function sfx(name){if(G&&G.cfg&&G.cfg.headless)return;
  if(!SND.on||!SND.vol||(G&&G.cfg&&G.cfg.headless))return;
  const now=performance.now();if(SND.last[name]&&now-SND.last[name]<45)return;SND.last[name]=now; // 같은 소리 연타 방지
  const c=sndCtx();if(!c)return;
  const cu=SND.custom[name];
  if(cu){sndBuffer(name).then(b=>{if(!b)return SYNTH[name]&&SYNTH[name](c);const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=SND.vol;s.connect(g).connect(c.destination);s.start()}).catch(()=>{});return}
  try{SYNTH[name]&&SYNTH[name](c)}catch(e){}
}
async function sndBuffer(name){

}

async function uploadSound(slot,file){

}

}

    return`<span class="kw k-trig">트리거${cs.map(c=>`<i style="--cc:var(--${c})">${c}</i>`).join('')}</span>`}

function showRules(){

  showModal(`<h2>룰 요약과 시뮬레이터 가정</h2>
  <div class="cols3">
   <div><h3>승리 조건</h3><p>컬러 콜에 성공하면 그 컬러 카드는 주인의 니지 에리어로 간다. 상대 니지 에리어에 7색이 모두 채워지면(상대 컬러 카드 7장을 모두 성공시키면) 승리.</p>
    <h3>준비 · 덱</h3><ul><li>채널 카드 1장 + 같은 클래스 메인 덱 50장 + 7색 컬러 카드(뒷면, 무작위 순서).</li><li>같은 카드는 4장까지. 한정 카드는 채널과 같은 #가 있어야 넣을 수 있다.</li><li>선공 5장, 후공 7장. 1회 다시 뽑을 수 있다.</li></ul>
    <h3>턴의 흐름</h3><ol><li><b>스타트</b> — 가로 라이버를 세로로. 손패가 5장이 될 때까지 드로우(5장 이상이면 1장).</li><li><b>메인</b> — 카드 플레이, 기동 효과. 레벨만큼의 카드를 손패·필드에서 로그로 보내는 게 코스트.</li><li><b>액션</b> — 세로 라이버로 공격 또는 컬러 콜. 행동한 라이버는 가로가 된다.</li><li><b>세트</b> — 손패 1장까지 세트 에어리어에 뒷면으로.</li><li><b>엔드</b> — "이번 턴 동안" 효과가 끝난다.</li></ol></div>
   <div><h3>배틀 · 컬러 콜</h3><ul><li>공격 대상은 상대의 가로 라이버 또는 컬러 카드.</li><li>배틀은 파워가 큰 쪽이 승리, 진 쪽은 로그로. 같으면 둘 다 로그로.</li><li>컬러 콜: 상대 컬러 카드 1장을 앞면으로 하고, 공격 라이버가 그 색을 가지고 있으면 그 카드는 상대의 니지 에리어로. 아니면 앞면인 채로 남는다.</li><li>블로커: 세로 상태에서 가로로 눕혀 상대의 공격·컬러 콜을 중지하고 대신 배틀. SP 콜은 막을 수 없다.</li><li>채널 트리거: 상대 턴 중 지정 색의 내 컬러 카드가 앞면이 되면 발동.</li></ul>
    <h3>조작</h3><ul><li>카드에 마우스를 올리면 효과 표시. 터치 화면은 한 번 누르면 표시되고, <b>길게 누르면</b> 선택하지 않고 효과만 봄. 설명 창은 누른 카드를 가리지 않는 쪽에 뜨고, 창 위를 눌러도 아래 카드가 눌림.</li><li>손패 카드를 누르면 위에 "플레이" 버튼. 한 번 더 눌러도 플레이. 필드로 드래그해도 플레이.</li><li>코스트가 있는 카드는 아래에서 올라오는 판에서 로그로 보낼 카드를 고른다.</li><li>액션 페이즈: 세로 라이버 → 대상 순서로 누르거나, 라이버를 대상까지 드래그.</li><li>로그 더미를 누르면 로그의 카드 확인.</li></ul></div>

/* 연결 경로: 같은 망이면 직접, 휴대폰 통신망(LTE·5G)처럼 직접 연결이 막히면 중계(TURN) 서버를 거침.
   config.js의 iceServers가 있으면 그걸 쓰고, 없으면 Google STUN + Open Relay 무료 중계(공개 공유 키, 월 사용량 제한 있음) */
function sha1(bytes){const H=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0];const l=bytes.length,n=((l+8>>6)+1)*16,w=new Array(n).fill(0);
  for(let i=0;i<l;i++)w[i>>2]|=bytes[i]<<(24-(i%4)*8);w[l>>2]|=0x80<<(24-(l%4)*8);w[n-1]=l*8;
  for(let i=0;i<n;i+=16){const W=new Array(80);let[a,b,c,d,e]=H;
    for(let t=0;t<80;t++){W[t]=t<16?w[i+t]|0:((x=>(x<<1)|(x>>>31))(W[t-3]^W[t-8]^W[t-14]^W[t-16]));
      const f=t<20?(b&c)|(~b&d):t<40?b^c^d:t<60?(b&c)|(b&d)|(c&d):b^c^d,k=t<20?0x5A827999:t<40?0x6ED9EBA1:t<60?0x8F1BBCDC:0xCA62C1D6;
      const tmp=(((a<<5)|(a>>>27))+f+e+k+W[t])|0;e=d;d=c;c=(b<<30)|(b>>>2);b=a;a=tmp}
    H[0]=H[0]+a|0;H[1]=H[1]+b|0;H[2]=H[2]+c|0;H[3]=H[3]+d|0;H[4]=H[4]+e|0}
  const out=new Uint8Array(20);H.forEach((h,i)=>{out[i*4]=h>>>24;out[i*4+1]=h>>>16&255;out[i*4+2]=h>>>8&255;out[i*4+3]=h&255});return out}
function hmacSha1(key,msg){const te=new TextEncoder();let k=te.encode(key);if(k.length>64)k=sha1(k);const kk=new Uint8Array(64);kk.set(k);
  const ip=kk.map(x=>x^0x36),op=kk.map(x=>x^0x5c);const m=te.encode(msg);const a=new Uint8Array(64+m.length);a.set(ip);a.set(m,64);
  const ih=sha1(a);const b=new Uint8Array(84);b.set(op);b.set(ih,64);return sha1(b)}
function relayIce(){const user=(Math.floor(Date.now()/1000)+86400)+':nijinana';const cred=btoa(String.fromCharCode(...hmacSha1('openrelayprojectsecret',user)));
  return{urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:80?transport=tcp','turn:staticauth.openrelay.metered.ca:443','turns:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:cred}}

  const s=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];if(!(C&&C.noRelay))try{s.push(relayIce())}catch(e){}return{iceServers:s}};
/* 연결 후보 모으기: 다 모이거나, 중계 후보가 나온 뒤 조금 더 기다리거나, 최대 7초 */
function waitIce(pc,ms){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();let done=false;const fin=()=>{if(!done){done=true;clearTimeout(t);res()}};

  pc.addEventListener('icecandidate',e=>{const c=e.candidate&&e.candidate.candidate||'';const ty=(c.match(/ typ (\w+)/)||[])[1];if(ty)MPG.cand[ty]=(MPG.cand[ty]||0)+1;if(ty==='relay')setTimeout(fin,1200)})})}

function setupDc(dc){
  MPG.dc=dc;

  dc.onopen=()=>{if(MPG.dc!==dc)return;clearTimeout(MPG.connT);
    if(MPG.start){MPG.lastRx=Date.now();try{dc.send(JSON.stringify({t:'hello',rx:MPG.rx}))}catch(e){}return} // 다시 이어짐: 내가 어디까지 받았는지 알림

/* 시드·선후공 공정하게 정하기 (커밋-공개): 방장이 비밀 난수의 해시를 먼저 보내고 → 참가자가 자기 난수를 보내고 → 방장이 비밀 난수를 공개.
   둘의 난수를 섞어서 시드와 선공을 정하므로 어느 한쪽이 원하는 패·선공이 나오게 고를 수 없음 */

async function authDo(kind){

  const fail=m=>{AUTH.busy=false;AUTH.msg=m;AUTH.err=true;renderLobby();const i=$('#lobby input[data-f]');if(i&&!i.value)i.focus()};
  if(kind==='guest'){setGuest(true);LOBBY.tab='home';AUTH.msg='';try{history.replaceState(lbState(),'')}catch(e){}renderLobby();return}
  if(!A)return fail('로그인 기능을 불러오지 못함 — 새로고침 후 다시 시도');
  const email=f.email.trim();
  if(kind==='login'){if(!email||!f.pw)return fail('아이디와 비밀번호를 입력해 줘')}
  if(kind==='signup'){const nick=f.nick.trim();
    if(nick.length<2||nick.length>12)return fail('닉네임은 2~12자');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('이메일 형식이 올바르지 않음');
    if(f.pw.length<8||!/[A-Za-z]/.test(f.pw)||!/[0-9]/.test(f.pw))return fail('비밀번호는 8자 이상, 영문과 숫자를 섞어서');
    if(f.pw!==f.pw2)return fail('비밀번호 확인이 일치하지 않음')}
  if(kind==='reset'&&!email)return fail('이메일을 입력해 줘');
  if(kind==='findid'&&!f.find.trim())return fail('이메일을 입력해 줘');
  AUTH.busy=true;AUTH.msg='';renderLobby();
  try{
    if(kind==='login'){await A.email(email,f.pw);rememberId(email);setGuest(false);location.reload();return}
    if(kind==='google'){await A.google();setGuest(false);location.reload();return}
    if(kind==='signup'){await A.signup(email,f.pw,f.nick.trim());rememberId(email);setGuest(false);location.reload();return}
    if(kind==='reset'||kind==='findid'){
      const to=kind==='reset'?email:f.find.trim();
      try{await A.reset(to)}catch(e){if(!/user-not-found/.test(e&&e.code||''))throw e} // 가입 여부를 화면에 드러내지 않음

  }catch(e){if(/popup-closed|cancelled-popup/.test(e&&e.code||'')){AUTH.busy=false;renderLobby();return}fail(authErr(e))}
}

let LOADING=false;
function loadOne(id,ms){return new Promise(res=>{let done=false;const fin=ok=>{if(!done){done=true;clearTimeout(t);res(ok)}};const t=setTimeout(()=>fin(false),ms);
  const go=url=>{if(!url||url==='data:,')return fin(false);const im=new Image();im.decoding='async';
    im.onload=()=>{(im.decode?im.decode():Promise.resolve()).catch(()=>{}).then(()=>fin(true))};im.onerror=()=>{if(!window.__imgLoad)BAD.add(id);fin(false)};im.src=url};
  try{if(window.__imgLoad)window.__imgLoad(id).then(go,()=>fin(false));else go(blobUrl(id))}catch(e){fin(false)}})}
function gameImgIds(dks){const ids=new Set();const add=id=>{if(id)ids.add(id)};

async function preloadGame(dks,hold){
  const host=$('#modal').parentNode;let ov=null,skip=false,n=0,bad=0,total=0,done=false,showT=0,skipT=0;
  const paint=()=>{if(!ov)return;const pct=total?Math.round(n/total*100):0;ov.querySelector('.ld-n').textContent=total?`${n} / ${total}`:'카드 정보 확인 중';ov.querySelector('.ld-bar i').style.width=pct+'%'};
  const show=()=>{if(done)return;ov=document.createElement('div');ov.id='ldov';ov.setAttribute('role','status');
    ov.innerHTML=`<div class="ld-box"><div class="ld-spin" aria-hidden="true"></div><b>카드 이미지 불러오는 중</b><div class="ld-bar"><i></i></div><span class="ld-n"></span><button class="btn sm ld-skip" hidden>기다리지 않고 시작</button></div>`;
    ov.querySelector('.ld-skip').onclick=()=>{skip=true;wake&&wake()};host.appendChild(ov);paint()};
  const arm=()=>{if(done)return;showT=setTimeout(show,180);skipT=setTimeout(()=>{const b=ov&&ov.querySelector('.ld-skip');if(b)b.hidden=false},5000)};
  if(hold)hold.then(arm,arm);else arm();
  let wake=null;const skipP=new Promise(r=>{wake=r});
  await Promise.race([waitArtMaps(4000),skipP]);
  const ids=skip?[]:gameImgIds(dks);total=ids.length;paint();
  const work=(async()=>{let i=0;const lane=async()=>{while(i<ids.length&&!skip){const id=ids[i++];if(!(await loadOne(id,15000)))bad++;n++;paint()}};
    await Promise.all(Array.from({length:Math.min(6,ids.length)},lane))})();
  await Promise.race([work,skipP]);
  done=true;clearTimeout(showT);clearTimeout(skipT);if(ov)ov.remove();
  if(bad&&!skip)toast(`이미지 ${bad}장을 불러오지 못함 — 글자 카드로 표시`);
}

const LBA={key:null,top:0,t:0};
function lbKey(el){if(!el||!el.dataset)return null;const d=el.dataset;const ks=['act','v','k','id','key','cid','uid','i','d'].filter(k=>d[k]!=null);if(!ks.length)return null;

  if(k){LBA.key=k;LBA.top=el.getBoundingClientRect().top;LBA.t=Date.now()}},true);
function lbKeepAnchor(L){
  if(!LBA.key||Date.now()-LBA.t>1500||LAYOUT.mode!=='resp')return;
  let n=null,best=1e9;try{for(const x of L.querySelectorAll(LBA.key)){const dd=Math.abs(x.getBoundingClientRect().top-LBA.top);if(dd<best){best=dd;n=x}}}catch(e){}if(!n)return; // 같은 버튼이 여러 개면 원래 자리에 가장 가까운 것
  for(let i=0;i<3;i++){const d=n.getBoundingClientRect().top-LBA.top;if(Math.abs(d)<1)break;const b=L.scrollTop;L.scrollTop=b+d;
    const moved=L.scrollTop-b;if(!moved)break;const d2=n.getBoundingClientRect().top-LBA.top;if(Math.abs(d2)<1)break;
    const ratio=(d-d2)/moved;if(ratio>0.05)L.scrollTop+=d2/ratio;break}
}

const RARORD={SEC:9,UR:8,SP:7,SR:6,SDR:5,R:4,UC:3,C:2,N:1};
const rarRank=r=>RARORD[r]||0;
const SRCH0=()=>({q:'',cls:[],type:[],lv:[],pw:[],col:[],tag:[],rar:[],feat:[]});
let SRCH=SRCH0();
const PWB=[['~3000',0,3000],['4000~5000',4000,5000],['6000~7000',6000,7000],['8000~9000',8000,9000],['10000~',10000,1e9]];
const FEATS=[['blocker','블로커'],['sp','SP'],['limited','한정'],['act','기동 효과'],['trig','트리거']];
function featOf(d,f){if(f==='blocker')return!!d.blocker;if(f==='sp')return!!d.sp;if(f==='limited')return!!d.limited;
  if(f==='act')return(d.text||'').includes('기동');if(f==='trig')return!!d.trigger||(d.text||'').includes('트리거');return false}
function deckSort(a,b){const A=CARDS[a],B=CARDS[b];const to={liver:0,event:1,stage:2};
  return(to[A.type]-to[B.type])||((A.lv||0)-(B.lv||0))||((A.power||0)-(B.power||0))||a.localeCompare(b)}
function thumbIds(dk){
  return Object.entries(dk.list||{}).filter(([k,v])=>v>0&&CARDS[k]).sort((x,y)=>rarRank(CARDS[y[0]].rar)-rarRank(CARDS[x[0]].rar)||y[1]-x[1]||(CARDS[y[0]].lv||0)-(CARDS[x[0]].lv||0)).slice(0,2).map(x=>x[0]);
}
function deckThumb(dk){

}

function srchMatch(k){
  const d=CARDS[k];const F=SRCH;
  if(F.q){const q=F.q.trim().toLowerCase();if(q){const hay=[d.name,d.jp,k,d.text||'',...(d.tags||[]).map(t=>'#'+t+' #'+tagKo(t))].join(' ').toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}}
  if(F.cls.length&&!F.cls.includes(d.cls))return false;
  if(F.type.length&&!F.type.includes(d.type))return false;
  if(F.lv.length&&(d.lv==null||!F.lv.includes(String(Math.min(5,d.lv)))))return false;
  if(F.pw.length){if(d.type!=='liver')return false;if(!F.pw.some(i=>{const b=PWB[+i];return d.power>=b[1]&&d.power<=b[2]}))return false}
  if(F.col.length){const cs=d.type==='channel'?(d.trigger||[]):(d.colors||[]);if(!F.col.some(c=>c==='none'?d.type==='liver'&&!cs.length:cs.includes(c)))return false}
  if(F.tag.length&&!F.tag.some(t=>(d.tags||[]).includes(t)))return false;
  if(F.rar.length&&!F.rar.includes(d.rar))return false;
  if(F.feat.length&&!F.feat.every(f=>featOf(d,f)))return false;
  return true;
}
function srchFiltersHTML(){
  const all=Object.keys(CARDS);
  const tags=[...new Set(all.flatMap(k=>CARDS[k].tags||[]))];
  const rars=[...new Set(all.map(k=>CARDS[k].rar))].sort((a,b)=>rarRank(b)-rarRank(a)||a.localeCompare(b));
  const clss=[...CLSLIST,...new Set(all.map(k=>CARDS[k].cls).filter(c=>!CLSLIST.includes(c)))];
  const chip=(g,v,l,ex='')=>`<button class="fchip ${SRCH[g].includes(v)?'on':''}" data-act="b-f" data-g="${g}" data-v="${esc(v)}" ${ex}>${l}</button>`;
  const grp=(label,chips)=>`<div class="fgrp"><span>${label}</span><div>${chips}</div></div>`;
  const chLock=BUILD&&BUILD.ch&&SRCH.cls.length===1&&SRCH.cls[0]===CARDS[BUILD.ch].cls;
  return grp('색상',clss.map(c=>chip('cls',c,`<i class="cdot" style="background:var(--${c})"></i>${CLSKO[c]||c}<small class="csub">${CLSSUB[c]||''}</small>`)).join('')+(chLock?'<em class="flock">채널 기준</em>':''))
   +grp('종류',[['channel','채널'],['liver','라이버'],['event','이벤트'],['stage','스테이지']].map(([v,l])=>chip('type',v,l)).join(''))
   +grp('레벨',['0','1','2','3','4','5'].map(v=>chip('lv',v,v==='5'?'5+':v)).join(''))
   +grp('파워',PWB.map((b,i)=>chip('pw',String(i),b[0])).join(''))
   +grp('컬러',COLORS.map(c=>chip('col',c,c,`style="--cc:var(--${c})"`)).join('')+chip('col','none','없음'))
   +grp('태그',tags.map(t=>chip('tag',t,'#'+esc(tagKo(t)))).join(''))
   +grp('레어도',rars.map(r=>chip('rar',r,esc(r))).join(''))
   +grp('특징',FEATS.map(([v,l])=>chip('feat',v,l)).join(''));
}

function setBuildCh(k){
  const B=BUILD;const cls=CARDS[k].cls;
  if(B.ch!==k){for(const x of Object.keys(B.list))if(CARDS[x].cls!==cls)delete B.list[x];B.ch=k;B.dirty=true;
    if(!B.id&&/^새 덱$|^새 .* 덱$/.test(B.name))B.name='새 '+CARDS[k].name+' 덱'}
  SRCH.cls=[cls];SRCH.type=SRCH.type.filter(t=>t!=='channel');LOBBY.pin=k;
}
function buildPick(k){
  const d=CARDS[k];if(!d||!BUILD)return;
  if(d.type==='channel'){setBuildCh(k);renderLobby();return}
  LOBBY.pin=k;
  if(!BUILD.ch){toast('채널 카드를 먼저 선택');renderLobby();return}
  if(d.cls!==CARDS[BUILD.ch].cls){toast('채널과 다른 색상 — 넣을 수 없음');renderLobby();return}
  const v=BUILD.list[k]||0;
  if(v>=4){toast('같은 카드는 4장까지');renderLobby();return}
  if(countList(BUILD.list)>=50){toast('50장 가득 참');renderLobby();return}
  BUILD.list[k]=v+1;BUILD.dirty=true;renderLobby();
}

function slotFromName(name){
  // 팩 번호: SD01~SD04, BP01 … (영문 2~4자 + 숫자 1~2자리 + 카드 번호 3자리). NJ-SD02-015 같은 접두어도 허용
  const n=String(name);
  for(const m of n.matchAll(/([A-Za-z]{2,4})\s*[-_]?\s*(\d{1,2})\D{0,2}(\d{3})/g)){
    const k=`${m[1].toUpperCase()}${m[2].padStart(2,'0')}-${m[3]}`;if(CARDS[k])return k}
  if(/logo|로고/i.test(n))return'_uiLogo';
  if(/key[\s_-]*visual|키[\s_-]*비주얼|banner|배너/i.test(n))return'_uiKV';
  if(/coin|코인/i.test(n))return/back|tail|뒷|뒤/i.test(n)?'_uiCoinT':'_uiCoinH';
  if(/board|게임[\s_-]*판/i.test(n))return'_uiBoard';
  if(/(channel|채널)[\s_-]*(back|뒷면)/i.test(n))return'_chback';

}

async function encodeCanvas(cv,alpha){
  const tb=(c,t,q)=>new Promise(r=>{try{c.toBlob(b=>r(b),t,q)}catch(e){r(null)}});const LIM=IMG_LIMIT();

/* crop dialog */
let CROP=null,DRAG=null;
async function openCrop(slot,file){
  let L;try{L=await loadImage(file)}catch(e){ADMIN.msg='이미지를 읽을 수 없음';ADMIN.err=true;renderLobby();return}
  const w=L.img.naturalWidth,h=L.img.naturalHeight,ratio=slotRatio(slot);
  if(!ratio){ // 자유 비율(로고 등): 자르지 않고 크기만 맞춰 저장 (투명 유지)
    const mw=UIRES[slot]?UIRES[slot].w:1200;const blob=await cropToBlob(L.img,{x:0,y:0,w,h},w/h,mw,true);URL.revokeObjectURL(L.url);
    if(!blob){ADMIN.msg='이미지 생성 실패';ADMIN.err=true;renderLobby();return}await uploadArt({[slot]:blob});return}
  const {k,stack}=cropFit(w,h);
  CROP={slot,img:L.img,url:L.url,w,h,ratio,k,rect:autoRect(w,h,ratio)};
  const pw=ratio<1?200:ratio===1?220:280,ph=Math.round(pw/ratio);
  showModal(`<h2>이미지 자르기 · ${esc(isBn(slot)?'배너 '+(BN.data.list.findIndex(b=>'bn:'+b.id===slot)+1):SPECIAL[slot]||CARDS[slot].name)}</h2>
   <p>밝은 틀 안이 카드 이미지가 된다. 틀을 드래그해 이동, 오른쪽 아래 점을 드래그해 크기 조절.</p>
   <div class="cropgrid ${stack?'stack':''}"><div class="cropbox" id="cropbox" style="width:${Math.round(w*k)}px;height:${Math.round(h*k)}px"><img src="${L.url}" alt="" draggable="false">
     <div class="croprect" id="croprect"><span class="crophandle" id="crophandle"></span></div></div>
    <div class="cropside"><canvas id="cropprev" width="${pw}" height="${ph}" style="width:${pw}px;height:${ph}px"></canvas>
     <div class="row">${ratio<1&&!isUI(slot)&&!isBn(slot)?'<button class="btn sm" data-act="crop-center">가운데 카드 (홍보 이미지)</button>':''}<button class="btn sm" data-act="crop-full">최대로</button></div>
     <p class="hint">${w}×${h} 이미지 · 저장 크기 ${isBn(slot)?'폭 1600px':isUI(slot)?`폭 ${UIRES[slot].w}px`:ratio<1?'744×1039':'1040×745'} 이하</p>
     <div class="mfoot"><button class="btn" data-act="crop-cancel">취소</button><button class="btn primary" data-act="crop-apply">적용</button></div></div></div>`,'1000px');
  updateCrop();
}
/* 자르기 틀 크기: 화면 크기(폭·높이)에 맞춤. 넓으면 옆에 미리보기, 좁으면 아래로 */
function cropFit(w,h){
  const W=LAYOUT.mode==='resp'?LAYOUT.w:1600,H=LAYOUT.mode==='resp'?LAYOUT.h:900;const stack=W<720;
  const bw=stack?W-72:Math.min(620,W-72-60-260),bh=stack?Math.max(200,H*.52):Math.max(220,Math.min(620,H-190));
  return{k:Math.min(bw/w,bh/h),stack};
}
function relayoutCrop(){if(!CROP)return;const b=$('#cropbox');if(!b)return;const f=cropFit(CROP.w,CROP.h);CROP.k=f.k;
  b.style.width=Math.round(CROP.w*f.k)+'px';b.style.height=Math.round(CROP.h*f.k)+'px';const g=b.closest('.cropgrid');if(g)g.classList.toggle('stack',f.stack);updateCrop()}
window.addEventListener('resize',()=>setTimeout(relayoutCrop,80));
function updateCrop(){
  if(!CROP)return;const R=CROP.rect,k=CROP.k;const el=$('#croprect');if(!el)return;
  el.style.left=(R.x*k)+'px';el.style.top=(R.y*k)+'px';el.style.width=(R.w*k)+'px';el.style.height=(R.h*k)+'px';
  const cv=$('#cropprev');if(cv){const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);g.drawImage(CROP.img,R.x,R.y,R.w,R.h,0,0,cv.width,cv.height)}
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
document.addEventListener('pointerdown',e=>{
  if(!CROP||!e.target.closest)return;const r=e.target.closest('#croprect');if(!r)return;
  e.preventDefault();DRAG={mode:e.target.closest('#crophandle')?'size':'move',sx:e.clientX,sy:e.clientY,o:{...CROP.rect}};
  try{r.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!DRAG||!CROP)return;const f=1/(STAGE_S*CROP.k);const dx=(e.clientX-DRAG.sx)*f,dy=(e.clientY-DRAG.sy)*f;
  const R=CROP.rect,o=DRAG.o,W=CROP.w,H=CROP.h,r=CROP.ratio;
  if(DRAG.mode==='move'){R.x=clamp(o.x+dx,0,W-o.w);R.y=clamp(o.y+dy,0,H-o.h)}
  else{const nw=clamp(o.w+Math.max(dx,dy*r),40,Math.min(W-o.x,(H-o.y)*r));R.w=nw;R.h=nw/r}
  updateCrop();
});
document.addEventListener('pointerup',()=>{DRAG=null});
function closeCrop(){if(CROP)URL.revokeObjectURL(CROP.url);CROP=null;hideModal()}
async function cropApply(){
  if(!CROP)return;const c=CROP;const blob=await cropToBlob(c.img,c.rect,c.ratio,isBn(c.slot)?1600:isUI(c.slot)?UIRES[c.slot].w:0,needAlpha(c.slot));closeCrop();
  if(isBn(c.slot)){if(blob)await uploadBanner(c.slot.slice(3),blob);else{ADMIN.msg='이미지 생성 실패';ADMIN.err=true;renderLobby()}return}
  if(!blob){ADMIN.msg='이미지 생성 실패';ADMIN.err=true;renderLobby();return}
  await uploadArt({[c.slot]:blob});
}

const fxT=ms=>Math.round(ms*(SPEED<1?0.62:1));
function fxWait(ms){const t=TOKEN;return new Promise((res,rej)=>setTimeout(()=>t.dead?rej(new Abort()):res(),ms*fxk()))}
const ANIM=new Map();
function mark(key,cls,dur,delay=0,vars=''){if(!FXON()||RM)return;const k=fxk();ANIM.set(key,{cls,start:performance.now()+delay*k,dur:dur*k,vars})}
function animOf(key){const a=ANIM.get(key);if(!a)return null;const now=performance.now();if(now>a.start+a.dur+40){ANIM.delete(key);return null}return{cls:'a-'+a.cls,delay:Math.round(a.start-now),vars:a.vars}}
const SEEN={h0:new Set(),h1:0,f:new Set()};
const FXHIDE=new Set(),FXDEAD=new Map(),NJHIDE=new Set();
function fxReset(){UI.mull=null;ANIM.clear();FXHIDE.clear();NJHIDE.clear();FXDEAD.clear();SEEN.h0=new Set();SEEN.h1=0;SEEN.f=new Set();const f=$('#fx');if(f)f.innerHTML='';$('#stage').classList.remove('defeat');const m=$('#mull');if(m){m.hidden=true;m.dataset.on=''}}

function stageRect(el){if(!el)return null;const r=el.getBoundingClientRect(),s=$('#stage').getBoundingClientRect();const k=STAGE_S||1;if(!r.width&&!r.height)return null;return{x:(r.left-s.left)/k,y:(r.top-s.top)/k,w:r.width/k,h:r.height/k}}

function fxEl(html,cls){const d=document.createElement('div');d.className=cls;d.innerHTML=html;$('#fx').appendChild(d);return d}
function anim(el,frames,opts){try{const k=fxk();if(opts&&k!==1){opts=Object.assign({},opts);if(opts.duration)opts.duration*=k;if(opts.delay)opts.delay*=k}
  const a=el.animate(frames,opts);const ms=(+(opts&&opts.duration)||0)+(+(opts&&opts.delay)||0)+700;

/* 화면 맞춤: 게임 판은 언제나 1600×900을 비율 그대로 축소·확대.
   로비는 데스크톱 크기(가로 1200·세로 660 이상)에서만 1600×900, 그보다 작은 화면(폰·폴드·태블릿)에서는
   실제 화면 크기를 그대로 써서 글씨가 작아지지 않게 하고, 배치는 #lobby 컨테이너 쿼리로 다시 짠다. */
const LAYOUT={mode:'desk',w:1600,h:900,gw:1600,hw:800};
const GW=()=>LAYOUT.gw||1600; // 게임 판 폭 (1240~1600)
const ROT={dismiss:false};
function fit(){
  const a=$('#app');if(!a)return;const cs=getComputedStyle(a);
  const pl=parseFloat(cs.paddingLeft)||0,pr=parseFloat(cs.paddingRight)||0,pt=parseFloat(cs.paddingTop)||0,pb=parseFloat(cs.paddingBottom)||0;
  const w=a.clientWidth-pl-pr,h=a.clientHeight-pt-pb;if(w<=0||h<=0)return;
  const desk=w>=1200&&h>=660;let W=1600,H=900,s;const prev=LAYOUT.mode+'|'+Math.round(LAYOUT.w);
  if(SCREEN!=='game'&&!desk){s=Math.min(1,w/360,h/420);W=w/s;H=h/s;LAYOUT.mode='resp'}
  else{ // 게임 판: 세로가 넉넉한 화면(폴드·태블릿·4:3)에서는 판 폭을 1240까지 줄여서 그만큼 카드·필드가 크게 보이게
    if(SCREEN==='game')W=Math.round(Math.max(1240,Math.min(1600,900*w/h)));s=Math.min(w/W,h/900);LAYOUT.mode='desk'}
  const gw0=LAYOUT.gw;LAYOUT.w=W;LAYOUT.h=H;STAGE_S=s;if(LAYOUT.mode==='desk')LAYOUT.gw=W;
  const st=$('#stage');st.style.width=W+'px';st.style.height=H+'px';st.style.setProperty('--sw',W+'px');st.style.setProperty('--sh',H+'px');
  st.style.transform=`translate(${(pl+(w-W*s)/2).toFixed(1)}px,${(pt+(h-H*s)/2).toFixed(1)}px) scale(${s.toFixed(4)})`;
  {const D=LAYOUT.mode==='desk'?W-1600:0;st.style.setProperty('--dx',(D/2)+'px');st.style.setProperty('--DD',D+'px');
   st.style.setProperty('--njw',Math.round(428+D*0.45)+'px');LAYOUT.hw=Math.round(800+D*0.5);st.style.setProperty('--hw',LAYOUT.hw+'px');
   st.classList.toggle('narrow',D<-80);st.classList.toggle('narrow2',D<-220)}
  st.classList.toggle('resp',LAYOUT.mode==='resp');st.classList.toggle('inlobby',SCREEN!=='game');
  // 크게 보기(줌) 크기: 작은 화면에서는 화면 안에 들어오게
  st.style.setProperty('--zs',Math.min(7.6,(W-48)/62,(H*0.58)/88).toFixed(3));st.style.setProperty('--zcs',Math.min(3.8,(W-48)/176,(H*0.5)/126).toFixed(3));
  // 작은 화면의 게임: 카드 설명·창·버튼을 판 축소에 맞춰 키워서 읽고 누르기 쉽게
  const mob=SCREEN==='game'?Math.max(1,Math.min(1.5,0.62/s)):1;
  st.style.setProperty('--mob',mob.toFixed(3));st.style.setProperty('--mob2',Math.min(mob,1.25).toFixed(3));st.style.setProperty('--hsm',mob>1.2?'1.15':'1');

  if(SCREEN==='game'&&gw0!==LAYOUT.gw&&G&&typeof render==='function')render();
}
